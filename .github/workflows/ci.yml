name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, type-check, test, and build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Determine check scope
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            echo "TURBO_FILTER=[${{ github.event.pull_request.base.sha }}]" >> "$GITHUB_ENV"
          else
            echo "TURBO_FILTER=" >> "$GITHUB_ENV"
          fi

      - name: Lint
        run: |
          if [[ -n "${TURBO_FILTER:-}" ]]; then
            pnpm exec turbo run lint --filter="$TURBO_FILTER"
          else
            pnpm lint
          fi

      - name: Type-check
        run: |
          if [[ -n "${TURBO_FILTER:-}" ]]; then
            pnpm exec turbo run typecheck --filter="$TURBO_FILTER"
          else
            pnpm typecheck
          fi

      - name: Test
        run: |
          if [[ -n "${TURBO_FILTER:-}" ]]; then
            pnpm exec turbo run test --filter="$TURBO_FILTER"
          else
            pnpm test
          fi

      - name: Build
        run: |
          if [[ -n "${TURBO_FILTER:-}" ]]; then
            pnpm exec turbo run build --filter="$TURBO_FILTER"
          else
            pnpm build
          fi
