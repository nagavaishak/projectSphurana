// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        // AGP 8.9.x is the first line that officially supports compileSdk 36; 8.7.2
        // only warns-and-hopes. Requires Gradle >= 8.11.1, which the wrapper pins.
        classpath 'com.android.tools.build:gradle:8.9.3'
        classpath 'com.google.gms:google-services:4.4.2'
        // Play Internal track upload — applied per-module in app/build.gradle when GPP creds are present.
        classpath 'com.github.triplet.gradle:play-publisher:3.10.1'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
