# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# 1536m starved the Gradle daemon on CI (the runner has 16GB). 4g lets the
# Kotlin/AGP compilers keep more in-process and cuts GC churn on assembleDebug.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

# Build modules in parallel (the project is multi-module: :app +
# :capacitor-cordova-android-plugins + the synced Capacitor plugin projects).
org.gradle.parallel=true

# Reuse task outputs across builds. Paired with the persisted ~/.gradle cache
# in CI (gradle/actions/setup-gradle) this turns a cold ~6 min assembleDebug
# into an incremental ~1-2 min one.
org.gradle.caching=true

# NOTE: org.gradle.configuration-cache is intentionally left off — the
# Capacitor cordova-plugins + Play Publisher plugins are not all
# configuration-cache compatible on AGP 8.9, and a CC miss/serialization
# failure would fail the build. Revisit once those plugins support it.

# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true
